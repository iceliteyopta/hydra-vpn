name: Test packaged Hydra on Android
on:
  push:
    branches: [rust-android-port]
    paths:
      - 'android/ui-test.*'
      - '.github/workflows/android-retest.yml'
permissions:
  contents: read
  actions: read
jobs:
  android-test:

    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for the APK built from this app revision
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git log -1 --format=%H -- android/build.sh android/hydra.patch android/overlay rust .github/workflows/android.yml)
          for attempt in {1..90}; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=Hydra-Mobile&per_page=100" --jq ".artifacts[] | select(.expired == false and .workflow_run.head_sha == \"$sha\") | .workflow_run.id" | head -1)
            if [[ -n "$id" ]]; then
              echo "Testing app commit $sha from run $id"
              echo "run_id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            result=$(gh run list -w android.yml -c "$sha" -L 1 --json conclusion --jq '.[0].conclusion')
            case "$result" in failure|cancelled|timed_out) echo "APK build: $result"; exit 1;; esac
            sleep 20
          done
          echo "Missing packaged APK for $sha" >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: Hydra-Mobile
          path: input
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Enable hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 2
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash android/ui-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hydra-Android-test
          path: |
            hydra-android-connected.png
            hydra-android-settings.png
            side-stream.txt
            test-server.log
            fixture.log

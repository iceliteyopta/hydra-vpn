name: Verify packaged Android APK
on:
  push:
    branches: [rust-android-port]
    paths: ['.github/workflows/android-retest.yml']
permissions:
  contents: read
  actions: read
jobs:
  android-test:

    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Hydra-Android-arm64
          path: input
          run-id: 45158703702
          github-token: ${{ github.token }}
      - name: Enable hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 2
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash android/ui-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hydra-Android-test
          path: |
            hydra-android-connected.png
            test-server.log
            fixture.log

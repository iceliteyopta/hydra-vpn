name: Hydra Android
on:
  workflow_dispatch:
  push:
    branches: [rust-android-port]
    paths-ignore:
      - 'android/ui-test.*'
      - '.github/workflows/android-retest.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: c005f35300ce76427dc285481ec5695f5b179cd2
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-android
          ref: f87c2ebdb7e34754be751bb5e58926db2fed8f8c
          path: mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false
      - name: Install Android build packages
        run: JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108" "platforms;android-37.1"
      - run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Hydra-Mobile
          path: mobile/app/build/outputs/apk/other/debug/*universal*.apk
          if-no-files-found: error
  android-test:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Hydra-Mobile
          path: input
      - name: Enable hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 2
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash android/ui-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hydra-Android-test
          path: |
            hydra-android-connected.png
            hydra-android-settings.png
            test-server.log
            fixture.log

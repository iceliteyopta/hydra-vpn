name: Hydra Android
on:
  workflow_dispatch:
  push:
    branches: [rust-android-port]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: c005f35300ce76427dc285481ec5695f5b179cd2
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-android
          ref: f87c2ebdb7e34754be751bb5e58926db2fed8f8c
          path: mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;28.0.13004108" "platforms;android-37.1"
      - run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Hydra-Android-arm64
          path: mobile/app/build/outputs/apk/other/debug/*arm64-v8a*.apk
          if-no-files-found: error
